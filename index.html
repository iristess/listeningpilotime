<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>פיילוט אורך סיפורים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm centered column (a listening booth). */
:root{
  --paper:#f4f8f7; --card:#ffffff; --ink:#203c43; --muted:#66767b; --line:#dce7e6;
  --teal:#2e6871; --teal-soft:#edf6f4; --pulse:#d4a35e; --pulse-soft:#f8eedf; --bad:#a4372c;
  --shadow:0 18px 50px rgba(30,75,78,.08);
  --display:"Assistant", Arial, sans-serif;
  --body:"Assistant", "Segoe UI", Arial, sans-serif;
}
:root,:root[data-theme]{color-scheme:light}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.wrap.wide{max-width:1040px}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.8rem} h2{font-size:1.4rem}
p{margin:0}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.muted{color:var(--muted)}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.opt:focus-within{outline:3px solid var(--teal);outline-offset:2px}
button{font:inherit;font-weight:700;border-radius:12px;padding:12px 24px;border:1px solid var(--teal);background:var(--teal);color:var(--card);cursor:pointer}
button.ghost{background:transparent;color:var(--teal)}
button.small{padding:6px 16px;font-size:.9rem;font-weight:600;border-color:var(--line);color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
ul.plain{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.q{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.q > .qt{font-weight:700}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:center;background:var(--paper);font-variant-numeric:tabular-nums}
.opt input:checked + span{background:var(--teal);color:var(--card);border-color:var(--teal)}
.anchors{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.err{color:var(--bad);font-weight:600}
/* listening booth */
.booth{align-items:center;text-align:center;padding-block:40px}
.pad{width:min(260px,70vw);aspect-ratio:1;max-width:100%;border-radius:50%;border:2px solid var(--pulse);background:var(--pulse-soft);color:var(--ink);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:1.15rem;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .08s}
.pad kbd{font-family:var(--body);font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--card);color:var(--muted)}
.pad.hit{transform:scale(.94);background:var(--pulse);color:#1a1205}
.wave{display:flex;gap:5px;height:22px;align-items:end}
.wave i{width:5px;background:var(--teal);border-radius:3px;animation:w 1.1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes w{0%,100%{height:5px}50%{height:22px}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;height:12px}.pad{transition:none}}
.steps{display:flex;gap:6px}
.steps b{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps b.on{background:var(--teal)}
pre.code{direction:ltr;text-align:left;font-size:.75rem;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}
/* results */
.chart{overflow-x:auto;direction:ltr}
.chart svg{display:block;min-width:560px;width:100%;height:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.85rem}
.tablewrap{overflow-x:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.logos{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:center}
.logos img{width:auto;max-width:100%;display:block}
.chip{display:inline-block;font-size:.8rem;border-radius:999px;padding:2px 10px;background:var(--teal-soft);color:var(--teal);font-weight:700}
</style>

<div class="wrap" id="app"></div>
<div class="wrap" id="exitbar" hidden style="margin-top:20px"></div>

<script>
(function(){
const STORIES=[
  {id:"s90", file:"story90.mp3", dur:95.32, label:"90 שניות", desc:"הסיפור על המחברת הירוקה שנשכחה באוטובוס"},
  {id:"s150",file:"story150.mp3",dur:136.12,label:"2.5 דקות", desc:"הסיפור על מי שנתקע במעלית"},
  {id:"s255",file:"story255.mp3",dur:256.29,label:"4.15 דקות", desc:"הסיפור על הצעדים הראשונים של הילדה"}
];
const BYID=Object.fromEntries(STORIES.map(s=>[s.id,s]));
const PERMS=[["s90","s150","s255"],["s90","s255","s150"],["s150","s90","s255"],["s150","s255","s90"],["s255","s90","s150"],["s255","s150","s90"]];
const TEST_MODE=false;
const KEY=TEST_MODE?"pilot2-test-progress":"pilot2-progress";
const app=document.getElementById("app");
const el=(h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+String(s).padStart(2,"0")};
let downloads=null;
if(window.claude&&window.claude.use){window.claude.use("downloads").then(d=>{downloads=d}).catch(()=>{})}

/* ---------- participant flow ---------- */
let S=null; // session data
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadSaved(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");return v&&!v.finishedAt?v:null}catch(e){return null}}
function clearSaved(){try{localStorage.removeItem(KEY)}catch(e){}}
let curAudio=null,curRec=null;
function renderExit(){
  const bar=document.getElementById("exitbar");
  const show=!!(S&&!S.finishedAt);
  bar.hidden=!show;if(!show){bar.innerHTML="";return}
  bar.innerHTML=`<div class="row" style="justify-content:center"><button class="ghost small" id="exitBtn">יציאה מהמחקר</button></div>`;
  bar.querySelector("#exitBtn").onclick=e=>{
    e.currentTarget.blur();
    const wasPlaying=curAudio&&!curAudio.paused&&!curAudio.ended;
    if(wasPlaying){curAudio.pause();curRec&&(curRec.pauses=curRec.pauses||[]).push(+curAudio.currentTime.toFixed(2))}
    bar.innerHTML=`<div class="card" role="dialog" aria-label="יציאה מהמחקר">
      <h2>לצאת מהמחקר?</h2>
      <p>אפשר להפסיק בכל שלב, בלי שום בעיה. מה לעשות עם התשובות שכבר נתתם?</p>
      <div class="row"><button id="exSave">לצאת ולשמור את התשובות</button><button class="ghost" id="exDel">לצאת בלי לשמור</button><button class="ghost" id="exBack">חזרה למחקר</button></div>
    </div>`;
    bar.querySelector("#exBack").onclick=()=>{renderExit();if(wasPlaying)curAudio.play().catch(()=>{})};
    bar.querySelector("#exSave").onclick=()=>{
      unbindPress();if(curAudio){curAudio.pause();if(curRec&&!curRec.endedAt)curRec.exitedAt=+curAudio.currentTime.toFixed(2)}
      curAudio=null;
      S.withdrawn={at:new Date().toISOString(),completedStories:S.stories.filter(x=>x.answers).length};
      S.finishedAt=S.withdrawn.at;persist();done();
    };
    bar.querySelector("#exDel").onclick=()=>{
      unbindPress();if(curAudio)curAudio.pause();curAudio=null;
      clearSaved();S=null;app.innerHTML="";renderExit();
      app.append(el(`<div class="card"><h1>יצאת מהמחקר</h1><p>התשובות לא נשמרו. תודה על הזמן שהקדשת.</p></div>`));
    };
  };
}
/* Save a file: Claude's downloads capability inside claude.ai, a normal browser download elsewhere. */
async function saveFile(filename,data,mime){
  if(downloads)return downloads.save({filename,data});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:mime||"application/json"}));
  a.download=filename;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  return {status:"saved"};
}
function makeCode(){
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";
  const r=new Uint32Array(6);(window.crypto||{getRandomValues:a=>a.map(()=>Math.random()*1e9)}).getRandomValues(r);
  for(let k=0;k<6;k++)s+=A[r[k]%A.length];
  return s.slice(0,3)+"-"+s.slice(3);
}
/* Google Sheets: paste the Apps Script web-app URL here once it exists.
   Works only when the page is hosted outside claude.ai (the artifact frame blocks outside requests). */
const SHEETS_URL="https://script.google.com/macros/s/AKfycbzwfA0fM8L6kl6q7QCof_biMstBIW-7Dlrnk91PtP4DAzksRLp_Vll2QdDPA1-3P_EofA/exec";
async function sendToSheets(data){
  if(!SHEETS_URL)return false;
  try{await fetch(SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});return true}
  catch(e){return false}
}
function stepsBar(i){return `<div class="steps" aria-hidden="true">${[0,1,2].map(k=>`<b class="${k<=i?"on":""}"></b>`).join("")}</div>`}

function welcome(){
  const saved=loadSaved();
  app.innerHTML="";renderExit();
  app.append(el(`<div class="stack" style="align-items:center;text-align:center"><h1>מחקר חוויית האזנה</h1></div>`));
  if(saved){
    const c=el(`<div class="card"><p>נראה שהתחלתם כבר את הפיילוט במכשיר הזה (${saved.stories.filter(x=>x.answers).length} מתוך 3 סיפורים הושלמו).</p><div class="row"><button id="cont">להמשיך מאיפה שעצרתי</button><button class="ghost" id="fresh">להתחיל מחדש</button></div></div>`);
    app.append(c);
    c.querySelector("#cont").onclick=()=>{S=saved;next()};
    c.querySelector("#fresh").onclick=()=>{clearSaved();welcome()};
    return;
  }
  const c=el(`<div class="card">
    <p>שלום, אני איריס, סטודנטית לתואר שני באוניברסיטת בר־אילן.</p>
    <p>המחקר נערך במעבדת MEG, כחלק מהמחלקה לפסיכולוגיה באוניברסיטת בר־אילן. תודה רבה על נכונותך להשתתף במחקר.</p>
    <p>במחקר זה תתבקשו להאזין לשלושה סיפורים קצרים, כל אחד באורך אחר, ולענות על כמה שאלות אחרי כל סיפור. כל סיפור מושמע פעם אחת בלבד ואי אפשר לעצור אותו, אז כדאי לשבת במקום שקט ולהשתמש באוזניות.</p>
    <p>בזמן ההאזנה: <b>לחצו על מקש הרווח</b> (או על העיגול הגדול במסך) בכל פעם שאתם מרגישים שהסיפור מעורר בכם רגש חזק, כל רגש שהוא. אפשר ללחוץ כמה פעמים שרוצים.</p>
    <p>אין תשובות נכונות או לא נכונות. אני מעוניינת בהתרשמות האישית שלכם מהסיפורים.</p>
    <p>ההשתתפות אנונימית והנתונים ישמשו לצורכי מחקר בלבד. כל משתתף מקבל קוד אישי, והנתונים נשמרים רק לפי הקוד.</p>
    <p class="muted">משך ההשתתפות המשוער: כ־12–15 דקות</p>
    <p class="muted">לשאלות בנוגע למחקר ניתן לפנות לאיריס במייל: <span dir="ltr" style="user-select:all">iristeslerr@gmail.com</span></p>
    <label class="row" for="agree" style="gap:10px;font-weight:600;cursor:pointer"><input id="agree" type="checkbox" style="width:20px;height:20px;margin:0">קראתי את ההסבר ואני מסכים/ה להשתתף</label>
    <div class="row"><button id="go" disabled>להתחלת המחקר</button></div>
  </div>`);
  app.append(c);
  const agree=c.querySelector("#agree"),go=c.querySelector("#go");
  agree.onchange=()=>{go.disabled=!agree.checked};
  go.onclick=()=>{
    if(!agree.checked)return;
    const oi=Math.floor(Math.random()*6),order=PERMS[oi];
    S={version:3,test:TEST_MODE||undefined,participant:makeCode(),orderIndex:oi,order,
       startedAt:new Date().toISOString(),userAgent:navigator.userAgent,
       stories:order.map((id,i)=>({id,position:i+1,duration:BYID[id].dur,presses:[],tabHidden:[],answers:null})),final:null};
    persist();practice();
  };
}

function practice(){
  app.innerHTML="";renderExit();
  let count=0,heard=false;
  const c=el(`<div class="card booth">
    <span class="eyebrow">הכנה לפני ההאזנה</span>
    ${TEST_MODE?`<p class="muted">מצב בדיקה · קוד: <b dir="ltr">${S.participant}</b></p>`:""}
    <div class="stack" style="align-items:center">
      <h2>1. כיוון עוצמת השמע</h2>
      <p>הפעילו את הקטע לדוגמה וכוונו את עוצמת השמע במחשב או באוזניות לרמה נוחה וברורה. אפשר להפעיל כמה פעמים שצריך.</p>
      <button class="ghost" id="vol">▶ הפעלת קטע לדוגמה</button>
      <p class="muted" id="volMsg" aria-live="polite"></p>
    </div>
    <div class="stack" style="align-items:center">
      <h2>2. תרגול לחיצה</h2>
      <p>נסו ללחוץ על מקש הרווח, או על העיגול.</p>
      <div class="pad" id="pad" role="button" tabindex="-1"><span>לחיצה</span><kbd>רווח</kbd></div>
      <p class="muted" id="pc">עוד לא נלחץ</p>
    </div>
    <p>כשהשמע מכוון והלחיצה עובדת, אפשר להתחיל. הסיפור הראשון יתחיל מיד אחרי הלחיצה על הכפתור.</p>
    <button id="start" disabled>להתחיל את הסיפור הראשון</button>
  </div>`);
  app.append(c);
  const pad=c.querySelector("#pad"),pc=c.querySelector("#pc"),st=c.querySelector("#start"),vol=c.querySelector("#vol"),volMsg=c.querySelector("#volMsg");
  const sample=new Audio("volume.mp3");sample.preload="auto";
  const ready=()=>{st.disabled=!(heard&&count>0)};
  vol.onclick=()=>{
    vol.blur();sample.currentTime=0;
    sample.play().then(()=>{volMsg.textContent="מתנגן…";vol.disabled=true})
      .catch(()=>{volMsg.innerHTML='<span class="err">הקטע לא נטען. בדקו את החיבור ורעננו את הדף.</span>'});
  };
  sample.addEventListener("ended",()=>{heard=true;vol.disabled=false;vol.textContent="▶ להפעיל שוב";volMsg.textContent="אם השמע נוח וברור, אפשר להמשיך.";ready()});
  const hit=()=>{count++;flash(pad);pc.textContent="נקלטו "+count+" לחיצות. מעולה.";ready()};
  bindPress(pad,hit);
  st.onclick=()=>{sample.pause();unbindPress();next()};
}

let keyHandler=null;
function bindPress(pad,fn){
  unbindPress();
  keyHandler=e=>{if(e.code==="Space"||e.key===" "){e.preventDefault();if(!e.repeat)fn()}};
  document.addEventListener("keydown",keyHandler);
  pad.addEventListener("pointerdown",e=>{e.preventDefault();fn()});
}
function unbindPress(){if(keyHandler)document.removeEventListener("keydown",keyHandler);keyHandler=null}
function flash(pad){pad.classList.add("hit");setTimeout(()=>pad.classList.remove("hit"),140)}

function next(){
  const i=S.stories.findIndex(x=>!x.answers);
  if(i===-1){return S.final?done():finalQs()}
  listen(i);
}

function listen(i){
  const rec=S.stories[i];
  rec.presses=[];rec.tabHidden=[];
  app.innerHTML="";renderExit();
  const c=el(`<div class="card booth">
    ${stepsBar(i)}
    <span class="eyebrow">סיפור ${i+1} מתוך 3</span>
    <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <p id="status">טוען את ההקלטה…</p>
    <div class="pad" id="pad" role="button" tabindex="-1"><span>רגע רגשי</span><kbd>רווח</kbd></div>
    <p class="muted">לחצו בכל פעם שהסיפור מעורר בכם רגש חזק.</p>
    <button id="play" hidden>להפעיל</button>
  </div>`);
  app.append(c);
  if(document.activeElement)document.activeElement.blur();
  const audio=new Audio(BYID[rec.id].file);audio.preload="auto";curAudio=audio;curRec=rec;
  const status=c.querySelector("#status"),pad=c.querySelector("#pad"),playBtn=c.querySelector("#play");
  let hiddenAt=null;
  const onVis=()=>{if(document.hidden){hiddenAt=audio.currentTime}else if(hiddenAt!=null){rec.tabHidden.push({at:+hiddenAt.toFixed(2),until:+audio.currentTime.toFixed(2)});hiddenAt=null}};
  document.addEventListener("visibilitychange",onVis);
  bindPress(pad,()=>{if(!audio.paused&&!audio.ended){rec.presses.push(+audio.currentTime.toFixed(3));flash(pad)}});
  const start=()=>{
    audio.play().then(()=>{status.textContent="מקשיבים…";playBtn.hidden=true;rec.startedAt=new Date().toISOString()})
      .catch(err=>{if(audio.error||(err&&err.name==="NotSupportedError")){status.innerHTML='<span class="err">ההקלטה לא נטענה. בדקו את החיבור ורעננו את הדף.</span>';playBtn.hidden=true}else{status.textContent="לחצו על הכפתור כדי להפעיל את השמע.";playBtn.hidden=false}});
  };
  playBtn.onclick=()=>{playBtn.blur();start()};
  audio.addEventListener("error",()=>{status.innerHTML='<span class="err">ההקלטה לא נטענה. בדקו את החיבור ורעננו את הדף.</span>'});
  audio.addEventListener("ended",()=>{
    unbindPress();document.removeEventListener("visibilitychange",onVis);curAudio=null;curRec=null;
    rec.endedAt=new Date().toISOString();rec.actualDuration=+audio.duration.toFixed(2);persist();questions(i);
  });
  start();
}

function radios(name,items){return `<div class="opts">${items.map(([v,t])=>`<label class="opt"><input type="radio" name="${name}" value="${v}"><span>${t}</span></label>`).join("")}</div>`}
function scale7(name,lo,hi){return `<div class="scale">${[1,2,3,4,5,6,7].map(v=>`<label class="opt"><input type="radio" name="${name}" value="${v}"><span>${v}</span></label>`).join("")}</div><div class="anchors"><span>${lo}</span><span>${hi}</span></div>`}
const val=(f,n)=>{const x=f.querySelector(`input[name="${n}"]:checked`);return x?x.value:null};

function questions(i){
  const rec=S.stories[i];
  app.innerHTML="";renderExit();
  const f=el(`<form class="card" novalidate>
    ${stepsBar(i)}
    <span class="eyebrow">סיפור ${i+1} מתוך 3 · שאלות</span>
    <div class="q"><span class="qt">כמה הסיפור היה מעניין?</span>${scale7("interest","1 = משעמם מאוד","7 = מעניין מאוד")}</div>
    <div class="q"><span class="qt">כמה קל היה לעקוב אחרי הסיפור?</span>${scale7("ease","1 = קשה מאוד","7 = קל מאוד")}</div>
    <div class="q"><span class="qt">האם בשלב כלשהו הפסקתם לעקוב או שהמחשבות נדדו?</span>${radios("lost",[["no","לא"],["start","כן, בהתחלה"],["middle","כן, באמצע"],["end","כן, לקראת הסוף"],["throughout","כן, לאורך כל הסיפור"]])}</div>
    <div class="q"><span class="qt">האורך של הסיפור היה:</span>${radios("length",[["short","קצר מדי"],["right","בדיוק טוב"],["long","ארוך מדי"]])}</div>
    <label class="field q" for="recall">במשפט או שניים: מה קרה בסוף הסיפור?<textarea id="recall"></textarea></label>
    <label class="field q" for="cm">מחשבות, תחושות או הערות על הסיפור<textarea id="cm"></textarea></label>
    <p class="err" id="qerr" hidden>חסרות תשובות. צריך לענות על כל שאלות הבחירה ולכתוב משהו בשדה המחשבות וההערות.</p>
    <div class="row"><button type="submit">${i<2?"לסיפור הבא":"להמשיך"}</button></div>
  </form>`);
  app.append(f);window.scrollTo(0,0);
  f.addEventListener("submit",e=>{
    e.preventDefault();
    const a={interest:+val(f,"interest")||null,ease:+val(f,"ease")||null,lost:val(f,"lost"),length:val(f,"length"),
      endRecall:f.querySelector("#recall").value.trim(),comments:f.querySelector("#cm").value.trim()};
    if(!a.interest||!a.ease||!a.lost||!a.length||!a.comments){f.querySelector("#qerr").hidden=false;return}
    rec.answers=a;persist();
    if(i<2){breakScreen(i)}else next();
  });
}

function breakScreen(i){
  app.innerHTML="";renderExit();
  const c=el(`<div class="card booth">${stepsBar(i)}<h2>הפסקה קצרה</h2><p>אפשר לנשום רגע. כשאתם מוכנים, הסיפור הבא יתחיל מיד אחרי הלחיצה.</p><button id="go">להתחיל את סיפור ${i+2}</button></div>`);
  app.append(c);c.querySelector("#go").onclick=()=>next();
}

function finalQs(){
  app.innerHTML="";renderExit();
  const f=el(`<form class="card" novalidate>
    <span class="eyebrow">כמעט סיימנו</span>
    <div class="q"><span class="qt">איזה סיפור הכי החזיק אתכם?</span>${radios("fav",S.stories.map(r=>[r.id,BYID[r.id].desc]))}</div>
    <div class="q"><span class="qt">אם הייתם צריכים להקשיב להרבה סיפורים כאלה ברצף, איזה אורך הכי היה מתאים לכם?</span>${radios("pref",S.stories.map(r=>[r.id,"כמו "+BYID[r.id].desc]))}</div>
    <label class="field q" for="gen">כל דבר נוסף שתרצו לספר: על הסיפורים, על ההאזנה, על הלחיצות (לא חובה)<textarea id="gen"></textarea></label>
    <div class="row"><button type="submit">לסיום</button></div>
  </form>`);
  app.append(f);window.scrollTo(0,0);
  f.addEventListener("submit",e=>{e.preventDefault();
    S.final={favorite:val(f,"fav"),preferredLength:val(f,"pref"),comments:f.querySelector("#gen").value.trim()};
    S.finishedAt=new Date().toISOString();persist();done();});
}

function done(){
  const json=JSON.stringify(S);
  const fname="pilot2_"+S.participant+".json";
  app.innerHTML="";renderExit();
  const c=el(`<div class="card">
    <span class="eyebrow">סיום</span>
    <h1>${S.withdrawn?"יצאת מהמחקר. תודה על הזמן!":"תודה רבה על השתתפותך!"}</h1>
    ${TEST_MODE?`<p class="muted">מצב בדיקה · קוד: <b dir="ltr">${S.participant}</b></p>`:""}
    <p id="sheetsNote" class="muted" aria-live="polite">שומר את התשובות…</p>
    <div id="fallback" class="stack" hidden>
      ${TEST_MODE?`<p class="eyebrow">מצב בדיקה: הנתונים שנשמרו</p>`:`<p>השמירה האוטומטית לא הצליחה. כדי שהתשובות לא ילכו לאיבוד, שמרו את הקובץ ושלחו אותו לאיריס, או העתיקו את הטקסט והדביקו בהודעה.</p>`}
      <div class="row"><button id="dl">שמירת קובץ התוצאות</button><button class="ghost" id="cp">העתקת התוצאות</button></div>
      <p id="msg" class="muted" aria-live="polite"></p>
      <pre class="code" id="code"></pre>
    </div>
  </div>`);
  app.append(c);
  const code=c.querySelector("#code"),msg=c.querySelector("#msg"),note=c.querySelector("#sheetsNote"),fb=c.querySelector("#fallback");code.textContent=json;
  if(TEST_MODE)fb.hidden=false;
  const ok=()=>{note.textContent="התשובות נשמרו. אפשר לסגור את הדף."};
  const fail=()=>{note.textContent=TEST_MODE?"מצב בדיקה: "+(SHEETS_URL?"השליחה לגיליון נכשלה.":"עדיין אין כתובת לגיליון (SHEETS_URL)."):"";note.hidden=!TEST_MODE;fb.hidden=false};
  if(S.sentToSheets)ok();
  else if(!SHEETS_URL)fail();
  else sendToSheets(S).then(r=>{if(r){S.sentToSheets=true;persist();ok()}else fail()});
  c.querySelector("#dl").onclick=async()=>{
    try{await saveFile(fname,json);msg.textContent="הקובץ נשמר: "+fname}
    catch(e){msg.textContent=e&&e.code==="declined"?"השמירה בוטלה. אפשר לנסות שוב או להעתיק.":"שמירת קובץ לא עבדה. העתיקו את התוצאות במקום."}
  };
  c.querySelector("#cp").onclick=()=>{
    const sel=()=>{const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r)};
    try{navigator.clipboard.writeText(json).then(()=>{msg.textContent="הועתק. הדביקו בהודעה לחוקרת."},()=>{sel();msg.textContent="הטקסט מסומן. העתיקו אותו ידנית (Ctrl+C)."})}
    catch(e){sel();msg.textContent="הטקסט מסומן. העתיקו אותו ידנית (Ctrl+C)."}
  };
}

/* ---------- testing panel (only when TEST_MODE is true) ---------- */
function testPanel(){
  const st=document.createElement("style");
  st.textContent=`#tp{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:50;background:var(--card);border:2px dashed var(--pulse);border-radius:14px;padding:12px;max-width:min(340px,calc(100vw - 24px));box-shadow:var(--shadow);font-size:14px;display:flex;flex-direction:column;gap:8px;direction:rtl}
  #tp .g{display:flex;flex-wrap:wrap;gap:6px}#tp button{padding:5px 10px;font-size:13px;border-radius:8px}#tp b{font-size:13px}
  #tp select{font:inherit;font-size:13px}#tpBanner{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:49;background:var(--pulse);color:#1a1205;text-align:center;font-weight:700;font-size:13px;padding:4px}`;
  document.head.append(st);
  document.body.append(el(`<div id="tpBanner">מצב בדיקה · הנתונים מסומנים test</div>`));
  const p=el(`<div id="tp" role="region" aria-label="פאנל בדיקה">
    <div class="row" style="justify-content:space-between"><b>פאנל בדיקה</b><button class="ghost" id="tpMin">מזעור</button></div>
    <div id="tpBody" class="stack" style="gap:8px">
      <label>סדר סיפורים: <select id="tpOrder">${PERMS.map((o,k)=>`<option value="${k}">${o.map(id=>BYID[id].label).join(" ← ")}</option>`).join("")}</select></label>
      <div class="g"><button data-go="welcome">פתיחה</button><button data-go="practice">תרגול</button></div>
      <div class="g">${[0,1,2].map(i=>`<button data-go="listen" data-i="${i}">האזנה ${i+1}</button>`).join("")}</div>
      <div class="g">${[0,1,2].map(i=>`<button data-go="q" data-i="${i}">שאלות ${i+1}</button>`).join("")}</div>
      <div class="g"><button data-go="break" data-i="0">הפסקה 1→2</button><button data-go="break" data-i="1">הפסקה 2→3</button><button data-go="final">שאלות סיום</button><button data-go="done">סיום</button></div>
      <div class="g"><button id="tpSkip">דלג ל-5 שניות לפני הסוף</button><button id="tpEnd">סיים הקלטה עכשיו</button></div>
      <div class="g"><button class="ghost" id="tpReset">איפוס מלא</button></div>
    </div>
  </div>`);
  document.body.append(p);
  const ord=p.querySelector("#tpOrder");
  const stopAudio=()=>{unbindPress();if(curAudio){curAudio.pause();curAudio=null;curRec=null}};
  const ensure=()=>{
    const oi=+ord.value;
    if(!S||S.orderIndex!==oi||S.finishedAt){
      const order=PERMS[oi];
      S={version:3,test:true,participant:"TEST-"+makeCode().slice(4),orderIndex:oi,order,startedAt:new Date().toISOString(),userAgent:navigator.userAgent,
        stories:order.map((id,i)=>({id,position:i+1,duration:BYID[id].dur,presses:[],tabHidden:[],answers:null})),final:null};
    }
    return S;
  };
  const fill=i=>{for(let k=0;k<i;k++){const r=S.stories[k];if(!r.answers)r.answers={interest:4,ease:4,lost:"no",length:"right",endRecall:"(test)",comments:""}}};
  p.querySelector("#tpBody").addEventListener("click",e=>{
    const b=e.target.closest("button[data-go]");if(!b)return;b.blur();
    const go=b.dataset.go,i=+b.dataset.i||0;
    stopAudio();
    if(go==="welcome"){clearSaved();S=null;welcome();return}
    ensure();
    if(go==="practice")practice();
    else if(go==="listen"){fill(i);S.stories[i].answers=null;listen(i)}
    else if(go==="q"){fill(i);questions(i)}
    else if(go==="break"){fill(i+1);for(let k=i+1;k<3;k++)S.stories[k].answers=null;breakScreen(i)}
    else if(go==="final"){fill(3);S.final=null;finalQs()}
    else if(go==="done"){fill(3);S.final=S.final||{favorite:S.order[0],preferredLength:S.order[1],comments:"(test)"};S.finishedAt=new Date().toISOString();done()}
  });
  p.querySelector("#tpSkip").onclick=e=>{e.currentTarget.blur();if(curAudio&&curAudio.duration)curAudio.currentTime=Math.max(0,curAudio.duration-5)};
  p.querySelector("#tpEnd").onclick=e=>{e.currentTarget.blur();if(curAudio){curAudio.pause();curAudio.dispatchEvent(new Event("ended"))}};
  p.querySelector("#tpReset").onclick=e=>{e.currentTarget.blur();stopAudio();clearSaved();S=null;welcome()};
  p.querySelector("#tpMin").onclick=e=>{const body=p.querySelector("#tpBody");body.hidden=!body.hidden;e.currentTarget.textContent=body.hidden?"פתיחה":"מזעור";e.currentTarget.blur()};
}
if(TEST_MODE)testPanel();

function route(){unbindPress();welcome()}
route();
})();
</script>

</body>
</html>
